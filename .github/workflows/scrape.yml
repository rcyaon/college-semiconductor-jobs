# Re-runs the scraper every morning and commits the refreshed JOBS.md.
# Only takes effect once this repo is on GitHub (Actions must be enabled).
name: Update job list

on:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC (8am Eastern)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOBS.md data/
          git diff --staged --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git push
